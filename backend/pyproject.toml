[project]
name = "sawt"
version = "0.1.0"
description = "Real-time multilingual (Arabic / French / English) voice agent with tool use, barge-in and measured latency."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Yassine El Ouni" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.3"]
edge = ["edge-tts>=6.1.12"]
local-llm = ["llama-cpp-python>=0.3.2"]
deepgram = ["websockets>=12.0"]
all = ["sawt[whisper,edge,local-llm,deepgram]"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "websockets>=12.0",
]

[project.scripts]
sawt-evals = "sawt.evals.cli:main"
sawt-bench = "sawt.bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sawt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: exercises the full pipeline over a real WebSocket"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic/French text in prompts and fixtures is intentional

[tool.ruff.lint.per-file-ignores]
# Multilingual copy and the model's own tool-calling template are kept verbatim.
"src/sawt/domain/faq.py" = ["E501"]
"src/sawt/providers/llm_llamacpp.py" = ["E501"]
"src/sawt/agent/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.uv]
# Resolve to versions that ship wheels for Intel macOS too (onnxruntime dropped them).
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
